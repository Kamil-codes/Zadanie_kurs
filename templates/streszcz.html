<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streszcz AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <nav>
            <a href="/">Zapytaj AI</a>
            <a href="/analiza-strona">Analiza danych</a>
            <a href="/streszcz">Streszczenie dowolnego tekstu</a>
        </nav>
        <h1>Zapytaj AI</h1>
        <form action="/streszcz" method="POST">
            <textarea
                name="streszcz"
                id="pytanie"
                rows="4"
                placeholder="Wpisz swój tekst..."
            ></textarea>
            <button type="submit">Wyślij</button>
        </form>
        <div class="answer-box">{% if odpowiedz %} <p>{{ odpowiedz }}</p> {% else %} <p>Tutaj pojawi się streszczenie AI.</p> {% endif %}
        </div>
    </main>
</body>
</html>
